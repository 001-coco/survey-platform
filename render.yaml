# Render 部署蓝图（后端）
# 用法：Render 控制台 → New → Blueprint → 选这个仓库 → 点 Apply，不用手动填任何参数。
services:
  - type: web
    name: survey-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 免费实例的文件系统是临时的，只能写 /tmp；重启后数据会重置为默认账号
      - key: DB_FILE
        value: /tmp/db.json
      # 跨域白名单：用通配匹配各平台默认域名，前端部署到哪儿都不用回来改这里。
      # 换成自己的自定义域名后，把域名加进这个逗号分隔的列表即可。
      - key: ALLOWED_ORIGINS
        value: "*.pages.dev,*.vercel.app,*.netlify.app,http://localhost:5173,http://localhost:3000"
